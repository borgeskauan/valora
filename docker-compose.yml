version: '3.8'

services:
  mongodb:
    image: mongo:8.2.1-noble
    container_name: mongodb
    ports:
      - "27017:27017"
    # Replica set enabled, no auth, bind to all interfaces
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongodb_data:/data/db
      # Script to auto-init the replica set exactly once
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

volumes:
  mongodb_data:
