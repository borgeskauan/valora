services:
  mongodb:
    image: mongo:8.2.1-noble
    container_name: mongodb
    ports:
      - "27017:27017"
    # Replica set enabled, no auth, bind to all interfaces
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongodb_data:/data/db
      # Script to auto-init the replica set exactly once
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    volumes:
      - qdrant_data:/qdrant/storage # <- use named volume
      - qdrant_snapshots:/qdrant/snapshots # <- use named volume

volumes:
  mongodb_data:
  qdrant_data:
  qdrant_snapshots:
